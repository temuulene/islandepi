# Installs islandepi the way the README tells staff to, on Windows with no
# Rtools: both packages from public GitHub, then the checkout under test.
name: GitHub installation without Rtools
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: windows-latest
    name: install (${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: ['4.4.1', 'release']
    env:
      # Hosted runners share GitHub's anonymous API allowance. A token keeps
      # the check reliable; it does not change what staff need to install.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Show this runner's anonymous GitHub API allowance
        run: curl -s https://api.github.com/rate_limit | grep -A4 '"core"' || true
        shell: bash
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          rtools-version: 'none'
      - name: Install both packages from public GitHub without compiler tools
        run: >-
          Rscript data-raw/check-github-install.R
          temuulene/islandepi temuulene/islandbrand
        shell: bash
      - name: Install the candidate checkout the same way
        run: Rscript data-raw/check-github-install.R .
        shell: bash
