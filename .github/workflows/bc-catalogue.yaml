# Checks that the pinned BC Data Catalogue sources still exist and still have
# the schema islh_bc_population() and islh_bc_geography() expect.
#
# Ordinary builds and tests never download from the catalogue; they use the
# fixture in tests/testthat/fixtures. This runs on demand and once a month.
name: BC catalogue live check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 3 * *"
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::bcdata
            any::sf
      - name: Check pinned sources
        run: Rscript .github/scripts/check-bc-catalogue.R
