name: Minimum declared dependencies
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::testthat
          needs: check
      - name: Pin declared minimum versions
        shell: Rscript {0}
        run: |
          remotes::install_version("dplyr", version = "1.1.4", upgrade = "never", dependencies = FALSE)
          remotes::install_version("tidyr", version = "1.3.0", upgrade = "never", dependencies = FALSE)
          remotes::install_version("lubridate", version = "1.9.0", upgrade = "never", dependencies = FALSE)
          remotes::install_version("tidyselect", version = "1.2.0", upgrade = "never", dependencies = FALSE)
      - name: Test at minimum versions
        shell: Rscript {0}
        run: testthat::test_local(stop_on_failure = TRUE)
