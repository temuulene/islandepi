# Checks the oldest versions DESCRIPTION promises, so the declared range is
# tested rather than assumed. Each run tests one floor:
#
# * hard: the oldest R (4.1) with the hard dependencies at their declared
#   minimums. Optional packages are not installed; their tests skip.
# * optional: the approved staff R (4.4.1) with current hard dependencies and
#   the optional surveillance and bcdata packages at their declared minimums.
#
# A step checks that every pinned package is installed at its pinned version
# and loads, so a failed pin fails the job rather than skipping tests.
#
# The sf floor is not pinned: an sf that old does not build against current
# GDAL. Its tests run against the current release in R-CMD-check.
name: Minimum declared dependencies
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum:
    name: R ${{ matrix.config.r }} (${{ matrix.config.deps }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-22.04, r: '4.1', deps: hard}
          - {os: ubuntu-latest, r: '4.4.1', deps: optional}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FLOOR: ${{ matrix.config.deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.deps == 'hard' && '"hard"' || '"all"' }}
          extra-packages: |
            any::remotes
            any::testthat
            any::pkgload
      - name: Pin declared minimum versions
        shell: Rscript {0}
        run: |
          pin <- function(package, version) {
            remotes::install_version(
              package,
              version = version,
              upgrade = "never",
              dependencies = FALSE
            )
          }
          if (Sys.getenv("FLOOR") == "hard") {
            pin("dplyr", "1.1.4")
            pin("tidyr", "1.3.0")
            pin("lubridate", "1.9.0")
            pin("tidyselect", "1.2.0")
          } else {
            # surveillance 1.20.0 needs packages the current release does
            # not. remotes cannot read its latin1 DESCRIPTION; base R honours
            # its Encoding field.
            install.packages(c(
              "sp", "xtable", "polyCub", "spatstat.geom",
              "Rcpp", "MASS", "Matrix", "nlme"
            ))
            install.packages(
              "https://cran.r-project.org/src/contrib/Archive/surveillance/surveillance_1.20.0.tar.gz",
              repos = NULL,
              type = "source"
            )
            pin("bcdata", "0.5.3")
          }
      - name: Confirm the pinned versions are installed and load
        shell: Rscript {0}
        run: |
          pins <- if (Sys.getenv("FLOOR") == "hard") {
            c(
              dplyr = "1.1.4",
              tidyr = "1.3.0",
              lubridate = "1.9.0",
              tidyselect = "1.2.0"
            )
          } else {
            c(surveillance = "1.20.0", bcdata = "0.5.3")
          }
          print(R.version.string)
          for (package in names(pins)) {
            installed <- tryCatch(
              as.character(packageVersion(package)),
              error = function(e) "not installed"
            )
            loads <- tryCatch(
              {
                loadNamespace(package)
                "loads"
              },
              error = function(e) conditionMessage(e)
            )
            cat(package, installed, loads, "\n")
            if (installed != pins[[package]] || loads != "loads") {
              stop(package, " is not usable at its declared minimum ", pins[[package]])
            }
          }
      - name: Test at minimum versions
        shell: Rscript {0}
        run: testthat::test_local(stop_on_failure = TRUE)
