# Checks the oldest versions DESCRIPTION promises, so the declared range is
# tested rather than assumed.
#
# * The oldest R (4.1) with the hard dependencies at their declared minimums.
#   Optional packages are not installed; their tests skip.
# * The approved staff R (4.4.1) with the same minimums, plus the optional
#   surveillance and bcdata packages at their declared minimums.
#
# The sf floor is not pinned: an sf that old does not build against current
# GDAL. Its tests run against the current release in R-CMD-check.
name: Minimum declared dependencies
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum:
    name: R ${{ matrix.config.r }} (${{ matrix.config.deps }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-22.04, r: '4.1', deps: hard}
          - {os: ubuntu-latest, r: '4.4.1', deps: optional}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.deps == 'hard' && '"hard"' || '"all"' }}
          extra-packages: |
            any::remotes
            any::testthat
            any::pkgload
      - name: Pin declared minimum versions
        shell: Rscript {0}
        run: |
          pin <- function(package, version) {
            remotes::install_version(
              package,
              version = version,
              upgrade = "never",
              dependencies = FALSE
            )
          }
          pin("dplyr", "1.1.4")
          pin("tidyr", "1.3.0")
          pin("lubridate", "1.9.0")
          pin("tidyselect", "1.2.0")
          if ("${{ matrix.config.deps }}" == "optional") {
            # remotes cannot read surveillance 1.20.0's latin1 DESCRIPTION;
            # base R honours its Encoding field.
            install.packages(
              "https://cran.r-project.org/src/contrib/Archive/surveillance/surveillance_1.20.0.tar.gz",
              repos = NULL,
              type = "source"
            )
            pin("bcdata", "0.5.3")
          }
      - name: Show the versions tested
        shell: Rscript {0}
        run: |
          packages <- c(
            "dplyr", "tidyr", "lubridate", "tidyselect", "surveillance", "bcdata"
          )
          installed <- packages[packages %in% rownames(installed.packages())]
          print(R.version.string)
          print(vapply(installed, function(p) as.character(packageVersion(p)), ""))
      - name: Test at minimum versions
        shell: Rscript {0}
        run: testthat::test_local(stop_on_failure = TRUE)
